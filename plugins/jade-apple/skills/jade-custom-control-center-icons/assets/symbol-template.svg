  <line id="Capline-L" style="fill:none;stroke:#27AAE1;opacity:1;stroke-width:0.5;" x1="263" x2="3036" y1="1485.54" y2="1485.54"/>
  <line id="left-margin-Regular-S" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="1392.62" x2="1392.62" y1="636.33" y2="755.67"/>
  <line id="right-margin-Regular-S" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="{{RIGHT_MARGIN_X}}" x2="{{RIGHT_MARGIN_X}}" y1="636.33" y2="755.67"/>
  <line id="left-margin-Regular-M" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="1392.62" x2="1392.62" y1="1066.33" y2="1185.67"/>
  <line id="right-margin-Regular-M" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="{{RIGHT_MARGIN_X}}" x2="{{RIGHT_MARGIN_X}}" y1="1066.33" y2="1185.67"/>
  <line id="left-margin-Regular-L" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="1392.62" x2="1392.62" y1="1496.33" y2="1615.67"/>
  <line id="right-margin-Regular-L" style="fill:none;stroke:#00AEEF;stroke-width:0.5;opacity:1.0;" x1="{{RIGHT_MARGIN_X}}" x2="{{RIGHT_MARGIN_X}}" y1="1496.33" y2="1615.67"/>
 </g>
 <g id="Symbols">
  <g id="Regular-S" transform="matrix(1 0 0 1 1392.62 696)">
